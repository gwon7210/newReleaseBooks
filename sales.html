<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>판매지수 대시보드</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
    }
    [hidden] { display: none !important; }
    .page-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-bottom: 20px;
    }
    .page-header h1 { margin: 0; }
    .nav a {
      margin-right: 12px;
      color: #888;
      text-decoration: none;
      font-weight: bold;
    }
    .nav a.active { color: #0066cc; }
    .nav a:hover { text-decoration: underline; }
    .deploy-date { color: #888; font-size: 0.85em; }

    .card {
      background-color: white;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 18px;
      margin: 0 0 12px;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }
    .card h3 { font-size: 15px; margin: 0 0 8px; color: #555; }
    .hint { color: #888; font-size: 0.85em; margin: 0 0 10px; }
    .info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-left: 6px;
      border-radius: 50%;
      border: 1px solid #aaa;
      color: #888;
      font-size: 11px;
      font-weight: bold;
      vertical-align: middle;
      cursor: help;
    }
    .info:hover, .info:focus { border-color: #0066cc; color: #0066cc; outline: none; }
    .info::after {
      content: attr(data-tip);
      position: absolute;
      left: 0;
      top: calc(100% + 6px);
      width: 260px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-size: 12px;
      font-weight: normal;
      line-height: 1.4;
      white-space: normal;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.1s;
    }
    .info:hover::after, .info:focus::after { opacity: 1; visibility: visible; }
    .tip { position: relative; cursor: help; }
    .tip::after {
      content: attr(data-tip);
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      width: max-content;
      max-width: 240px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-size: 12px;
      font-weight: normal;
      text-align: left;
      line-height: 1.4;
      white-space: normal;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.1s;
      pointer-events: none;
    }
    .tip:hover::after { opacity: 1; visibility: visible; }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
    }
    .tile {
      background: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .tile .label { color: #888; font-size: 0.8em; margin-bottom: 4px; }
    .tile .value { font-size: 24px; font-weight: bold; }
    .tile .sub { font-size: 0.85em; color: #555; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tile .sub a { color: #333; text-decoration: none; }
    .tile .sub a:hover { color: #0066cc; text-decoration: underline; }
    .tile.clickable { cursor: pointer; }
    .tile.clickable:hover { box-shadow: 0 2px 8px rgba(0,102,204,0.25); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal {
      background: #fff;
      border-radius: 10px;
      width: min(960px, 100%);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .modal-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid #eee;
    }
    .modal-head h2 { margin: 0; font-size: 18px; flex: 1; }
    .modal-close {
      border: none;
      background: none;
      font-size: 24px;
      line-height: 1;
      color: #888;
      padding: 0 4px;
    }
    .modal-close:hover { color: #333; background: none; }
    .modal-body { padding: 18px; overflow-y: auto; }
    .modal-body .empty { padding: 30px 0; }
    .book-list { display: flex; flex-direction: column; }
    .book-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      min-width: 0;
    }
    .book-item:last-child { border-bottom: none; }
    .book-item img { width: 40px; height: 56px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
    .book-item .book-title {
      flex: 1;
      min-width: 0;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .book-item .book-title a { color: #333; text-decoration: none; }
    .book-item .book-title a:hover { color: #0066cc; text-decoration: underline; }
    .book-item .book-date { font-size: 12px; color: #888; flex-shrink: 0; }
    .new-badge {
      display: inline-block;
      background-color: #e74c3c;
      color: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      margin-right: 8px;
      vertical-align: middle;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.9em;
    }
    .controls label { display: inline-flex; align-items: center; gap: 4px; }
    select, input[type="search"], input[type="text"] {
      font: inherit;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }
    button {
      font: inherit;
      font-size: 0.85em;
      padding: 3px 8px;
      border: 1px solid #0066cc;
      border-radius: 4px;
      background: #fff;
      color: #0066cc;
      cursor: pointer;
    }
    button:hover { background: #eef5ff; }
    button:disabled { color: #aaa; border-color: #ddd; cursor: default; background: #fff; }
    .toggle button.active { background: #0066cc; color: #fff; }
    button.selected { background: #0066cc; color: #fff; }
    button.selected:hover { background: #c0392b; border-color: #c0392b; }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }
    th { color: #666; font-weight: bold; background: #fafafa; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.title { max-width: 0; width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    td.title a { color: #333; text-decoration: none; font-weight: bold; }
    td.title a:hover { color: #0066cc; text-decoration: underline; }
    td.rank { color: #888; width: 36px; }
    td img { width: 32px; height: 45px; object-fit: cover; border-radius: 3px; display: block; }
    .pos { color: #c0392b; }
    .neg { color: #1c5cab; }
    .partial { color: #888; }
    .stale { color: #aaa; }
    .empty { color: #888; padding: 16px 0; text-align: center; }

      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px 3px 6px;
      border-radius: 14px;
      border: 1px solid #ddd;
      font-size: 0.85em;
      background: #fafafa;
    }
    .chip .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .chip button { border: none; padding: 0 2px; color: #888; font-size: 1em; line-height: 1; }
    .chip button:hover { color: #c0392b; background: none; }
    .search-box { position: relative; flex: 1 1 260px; }
    .search-box input { width: 100%; box-sizing: border-box; }
    .matches {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      z-index: 5;
      max-height: 260px;
      overflow-y: auto;
    }
    .matches div { padding: 6px 8px; font-size: 0.9em; cursor: pointer; }
    .matches div:hover { background: #eef5ff; }
    .matches .pub { color: #888; margin-left: 6px; font-size: 0.9em; }
    .chart-box { position: relative; height: 360px; }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .chart-box { height: 280px; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>판매지수 대시보드</h1>
    <nav class="nav">
      <a href="index.html">신간</a>
      <a href="sales.html" class="active">판매지수</a>
    </nav>
    <span class="deploy-date">업데이트 <span id="deploy-date"></span> · 데이터 기준일 <span id="latest-date"></span></span>
  </header>

  <div id="loading" class="empty">데이터를 불러오는 중...</div>

  <div id="app" hidden>
    <div class="tiles" id="tiles" style="margin-bottom: 20px;"></div>


    <section class="card" id="momentum">
      <h2>상승세 <span class="info" tabindex="0" data-tip="*가 붙은 값은 기록이 선택한 기간보다 짧아, 있는 기록 중 가장 오래된 날과 비교한 값입니다. 숫자에 마우스를 올리면 며칠 기준인지 나옵니다.">!</span></h2>
      <div class="controls">
        <label>출판사 <select id="publisher-select"></select></label>
        <input type="search" id="query" placeholder="제목 검색">
        <span class="toggle">
          <button type="button" data-window="1">1일</button>
          <button type="button" data-window="3">3일</button>
          <button type="button" data-window="7" class="active">7일</button>
          <button type="button" data-window="30">30일</button>
        </span>
      </div>
      <div id="momentum-body"></div>
    </section>

    <section class="card" id="trend">
      <h2>추이</h2>
      <p class="hint">책을 골라 판매지수 변화를 비교합니다. 최대 8권까지 담을 수 있고, 상승세 표의 "비교" 버튼으로도 추가됩니다.</p>
      <div class="controls">
        <div class="search-box">
          <input type="text" id="trend-search" placeholder="제목으로 책 추가" autocomplete="off">
          <div class="matches" id="trend-matches" hidden></div>
        </div>
        <button type="button" id="clear-selected">모두 비우기</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="empty" id="trend-empty">비교할 책을 검색하거나 상승세 표에서 "비교"를 눌러 담아 주세요.</div>
      <div class="chart-box" id="trend-box" hidden><canvas id="trend-chart"></canvas></div>
    </section>

  </div>

  <div class="modal-backdrop" id="fresh-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="fresh-title">
      <div class="modal-head">
        <h2 id="fresh-title">새로 들어온 도서</h2>
        <button type="button" class="modal-close" id="fresh-close" title="닫기">×</button>
      </div>
      <div class="modal-body">
        <div class="book-list" id="fresh-list"></div>
      </div>
    </div>
  </div>

  <script>
    const PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
    const MAX_SELECTED = PALETTE.length;
    const GRID = '#e1e0d9';
    const MUTED = '#898781';

    const state = {
      data: null,
      byGoods: new Map(),
      publisher: '',
      query: '',
      window: 7,
      selected: [],          // [{goods_no, color}]
      trendChart: null,
    };

    // ------------------------------------------------------------------ helpers
    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (key === 'className') node.className = value;
        else if (key === 'text') node.textContent = value;
        else if (key === 'onClick') node.addEventListener('click', value);
        else if (value !== null && value !== undefined) node.setAttribute(key, value);
      }
      for (const child of children) {
        if (child === null || child === undefined) continue;
        node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
      }
      return node;
    }

    function fmt(n) {
      return n === null || n === undefined ? '-' : Number(n).toLocaleString('ko-KR');
    }

    function fmtSigned(n) {
      if (n === null || n === undefined) return '-';
      return (n > 0 ? '+' : '') + fmt(n);
    }

    function deltaCell(value, days, window) {
      if (value === null || value === undefined) {
        return el('td', { className: 'num partial tip', text: '-', 'data-tip': '기록이 이틀 미만이라 변화를 계산할 수 없습니다' });
      }
      const cls = value > 0 ? 'pos' : value < 0 ? 'neg' : '';
      const partial = days < window;
      const td = el('td', { className: `num ${cls} ${partial ? 'tip' : ''}`, text: fmtSigned(value) + (partial ? '*' : '') });
      if (partial) td.setAttribute('data-tip', `${window}일 전 기록이 없어 ${days}일 전 값과 비교했습니다`);
      return td;
    }

    function titleCell(book) {
      const link = book.detail_url
        ? el('a', { href: book.detail_url, target: '_blank', rel: 'noopener', text: book.title })
        : el('span', { text: book.title });
      return el('td', { className: 'title', title: book.title }, [link]);
    }

    function compareButton(book) {
      const already = state.selected.some(s => s.goods_no === book.goods_no);
      if (already) {
        return el('button', {
          type: 'button',
          className: 'selected',
          text: '담김 ×',
          title: '비교에서 빼기',
          onClick: () => removeSelected(book.goods_no),
        });
      }
      const full = state.selected.length >= MAX_SELECTED;
      return el('button', {
        type: 'button',
        text: '비교',
        disabled: full ? '' : null,
        title: full ? `최대 ${MAX_SELECTED}권까지 비교할 수 있습니다` : null,
        onClick: () => addSelected(book.goods_no),
      });
    }

    function ranked() {
      return state.data.books.filter(b => b.latest !== null);
    }

    function filtered() {
      const q = state.query.trim().toLowerCase();
      return ranked().filter(b =>
        (!state.publisher || b.publisher === state.publisher) &&
        (!q || b.title.toLowerCase().includes(q))
      );
    }

    function expandSeries(book) {
      if (!book.series) return [];
      return Array(book.series_start).fill(null).concat(book.series);
    }

    // ------------------------------------------------------------------ summary
    function moverTile(label, book, key, daysKey) {
      if (!book) {
        return el('div', { className: 'tile' }, [el('div', { className: 'label', text: label }), el('div', { className: 'value partial', text: '-' }),
          el('div', { className: 'sub', text: '기록이 이틀 이상 필요합니다' })]);
      }
      const stale = book[daysKey] !== 1;   // 어제 기록이 없어 더 이전 값과 비교한 경우
      const value = el('div', { className: `value ${book[key] > 0 ? 'pos' : book[key] < 0 ? 'neg' : ''} ${stale ? 'tip' : ''}`, text: fmtSigned(book[key]) + (stale ? '*' : '') });
      if (stale) value.setAttribute('data-tip', `어제 기록이 없어 ${book[daysKey]}일 전 값과 비교했습니다`);
      const link = book.detail_url ? el('a', { href: book.detail_url, target: '_blank', rel: 'noopener', text: book.title }) : el('span', { text: book.title });
      return el('div', { className: 'tile' }, [el('div', { className: 'label', text: label }), value,
        el('div', { className: 'sub', title: `${book.title} · ${book.publisher}` }, [link, ` · ${book.publisher}`])]);
    }

    function freshBooks(days) {
      const since = new Date(state.data.today);
      since.setDate(since.getDate() - (days - 1));
      const sinceIso = since.toISOString().slice(0, 10);
      return state.data.books
        .filter(b => b.first_seen && b.first_seen >= sinceIso)
        .sort((a, b) => (b.release_date || '').localeCompare(a.release_date || ''));   // 출간일 최신순, 출간일 없는 책은 뒤로
    }

    function renderFresh() {
      const books = freshBooks(7);
      document.getElementById('fresh-title').textContent = `최근 7일 새로 들어온 도서 (${fmt(books.length)}권)`;
      const list = document.getElementById('fresh-list');
      if (books.length === 0) {
        list.replaceChildren(el('div', { className: 'empty', text: '해당 기간에 새로 들어온 도서가 없습니다.' }));
        return;
      }
      list.replaceChildren(...books.map(b =>
        el('div', { className: 'book-item' }, [
          b.image_url ? el('img', { src: b.image_url, alt: '' }) : null,
          el('div', { className: 'book-title', title: b.title }, [
            b.first_seen === state.data.today ? el('span', { className: 'new-badge', text: 'NEW' }) : null,
            b.detail_url ? el('a', { href: b.detail_url, target: '_blank', rel: 'noopener', text: b.title }) : el('span', { text: b.title }),
          ]),
          el('div', { className: 'book-date', text: b.release_date ? `출간 ${b.release_date}` : '' }),
        ])
      ));
    }

    function openFresh() {
      renderFresh();
      document.getElementById('fresh-modal').hidden = false;
      document.getElementById('fresh-close').focus();
    }

    function closeFresh() {
      document.getElementById('fresh-modal').hidden = true;
    }

    function renderSummary() {
      const d = state.data;
      const key = 'delta1', daysKey = 'delta1_days';
      const movers = ranked().filter(b => b[key] !== null);
      const top = movers.length ? movers.reduce((a, b) => (b[key] > a[key] ? b : a)) : null;
      const bottom = movers.length ? movers.reduce((a, b) => (b[key] < a[key] ? b : a)) : null;
      const today = freshBooks(1).length, week = freshBooks(7).length;
      const freshTile = el('div', { className: 'tile clickable', onClick: openFresh }, [
        el('div', { className: 'label', text: '오늘 새로 들어온 도서' }),
        el('div', { className: 'value', text: `${fmt(today)}권` }),
        el('div', { className: 'sub', text: `최근 7일 ${fmt(week)}권 · 눌러서 목록 보기` }),
      ]);
      const plain = (label, value) => el('div', { className: 'tile' }, [el('div', { className: 'label', text: label }), el('div', { className: 'value', text: value })]);
      document.getElementById('tiles').replaceChildren(
        plain('추적 도서', fmt(d.books.length)),
        plain('출판사', fmt(d.publishers.length)),
        moverTile('전일 대비 최다 상승', top, key, daysKey),
        moverTile('전일 대비 최다 하락', bottom, key, daysKey),
        freshTile,
      );
    }

    // ------------------------------------------------------------------ momentum
    function momentumTable(books, key, daysKey, window) {
      if (books.length === 0) {
        return el('div', { className: 'empty', text: '데이터 부족: 판매지수를 이틀 이상 기록해야 변화를 계산할 수 있습니다.' });
      }
      const head = el('tr', {}, [
        el('th', { text: '순위' }), el('th', { text: '제목' }), el('th', { text: '출판사' }),
        el('th', { className: 'num', text: '판매지수' }), el('th', { className: 'num', text: `${window}일 변화` }), el('th', { text: '' }),
      ]);
      const rows = books.map((b, i) => el('tr', {}, [
        el('td', { className: 'rank', text: String(i + 1) }),
        titleCell(b),
        el('td', { text: b.publisher }),
        el('td', { className: 'num', text: fmt(b.latest) }),
        deltaCell(b[key], b[daysKey], window),
        el('td', {}, [compareButton(b)]),
      ]));
      return el('div', { className: 'table-wrap' }, [el('table', {}, [el('thead', {}, [head]), el('tbody', {}, rows)])]);
    }

    function renderMomentum() {
      const key = `delta${state.window}`;
      const top = filtered().filter(b => b[key] !== null).sort((a, b) => b[key] - a[key]).slice(0, 20);
      document.getElementById('momentum-body').replaceChildren(momentumTable(top, key, `${key}_days`, state.window));
    }

    // ------------------------------------------------------------------ trend
    function addSelected(goodsNo) {
      if (state.selected.some(s => s.goods_no === goodsNo)) return;
      if (state.selected.length >= MAX_SELECTED) return;
      const used = new Set(state.selected.map(s => s.color));
      const color = PALETTE.find(c => !used.has(c));   // 슬롯 순서대로, 비어 있는 첫 색
      state.selected.push({ goods_no: goodsNo, color });
      renderTrend();
      renderMomentum();
    }

    function removeSelected(goodsNo) {
      state.selected = state.selected.filter(s => s.goods_no !== goodsNo);
      renderTrend();
      renderMomentum();
    }

    function renderChips() {
      const box = document.getElementById('chips');
      box.replaceChildren(...state.selected.map(s => {
        const book = state.byGoods.get(s.goods_no);
        return el('span', { className: 'chip' }, [
          el('span', { className: 'swatch', style: `background:${s.color}` }),
          book.title,
          el('button', { type: 'button', text: '×', title: '제거', onClick: () => removeSelected(s.goods_no) }),
        ]);
      }));
    }

    function renderTrend() {
      renderChips();
      document.getElementById('trend-empty').hidden = state.selected.length > 0;
      document.getElementById('trend-box').hidden = state.selected.length === 0;
      const labels = state.data.dates;
      const datasets = state.selected.map(s => {
        const book = state.byGoods.get(s.goods_no);
        const values = expandSeries(book);
        return {
          label: book.title.length > 30 ? book.title.slice(0, 30) + '…' : book.title,
          data: values,
          borderColor: s.color,
          backgroundColor: s.color,
          borderWidth: 2,
          pointRadius: 3,
          pointHoverRadius: 5,
          spanGaps: true,
          tension: 0,
        };
      });
      const options = {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: datasets.length > 0, position: 'bottom', labels: { boxWidth: 12, usePointStyle: true } },
          tooltip: {
            callbacks: {
              label: (ctx) => ` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`,
            },
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: MUTED, maxTicksLimit: 12, maxRotation: 0, autoSkipPadding: 16, callback: (v, i) => (labels[i] || '').slice(5) } },
          y: {
            beginAtZero: true,
            grid: { color: GRID },
            border: { display: false },
            ticks: { color: MUTED, callback: (v) => fmt(v) },
            title: { display: true, text: '판매지수', color: MUTED },
          },
        },
      };
      if (state.trendChart) {
        state.trendChart.data = { labels, datasets };
        state.trendChart.options = options;
        state.trendChart.update();
      } else {
        state.trendChart = new Chart(document.getElementById('trend-chart'), { type: 'line', data: { labels, datasets }, options });
      }
    }

    function renderMatches() {
      const box = document.getElementById('trend-matches');
      const q = document.getElementById('trend-search').value.trim().toLowerCase();
      if (!q) { box.hidden = true; return; }
      const chosen = new Set(state.selected.map(s => s.goods_no));
      const matches = ranked().filter(b => !chosen.has(b.goods_no) && b.title.toLowerCase().includes(q)).slice(0, 10);
      box.replaceChildren(...matches.map(b =>
        el('div', { onClick: () => { addSelected(b.goods_no); document.getElementById('trend-search').value = ''; box.hidden = true; } }, [
          b.title, el('span', { className: 'pub', text: b.publisher }),
        ])
      ));
      if (matches.length === 0) box.replaceChildren(el('div', { text: '일치하는 책이 없습니다', style: 'color:#888;cursor:default' }));
      box.hidden = false;
    }

    // ------------------------------------------------------------------ wiring
    function bindControls() {
      const pubSelect = document.getElementById('publisher-select');
      pubSelect.replaceChildren(
        el('option', { value: '', text: '전체' }),
        ...state.data.publishers.map(p => el('option', { value: p.name, text: p.name }))
      );
      pubSelect.addEventListener('change', () => { state.publisher = pubSelect.value; renderMomentum(); });
      document.getElementById('query').addEventListener('input', (e) => { state.query = e.target.value; renderMomentum(); });
      document.querySelectorAll('#momentum [data-window]').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('#momentum [data-window]').forEach(b => b.classList.toggle('active', b === btn));
        state.window = Number(btn.dataset.window);
        renderMomentum();
      }));

      const search = document.getElementById('trend-search');
      search.addEventListener('input', renderMatches);
      search.addEventListener('focus', renderMatches);
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-box')) document.getElementById('trend-matches').hidden = true;
      });
      document.getElementById('clear-selected').addEventListener('click', () => { state.selected = []; renderTrend(); renderMomentum(); });
    }

    function bindFreshModal() {
      const modal = document.getElementById('fresh-modal');
      document.getElementById('fresh-close').addEventListener('click', closeFresh);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeFresh(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.hidden) closeFresh(); });
    }

    async function loadAll() {
      try {
        const response = await fetch('sales_data.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.data = await response.json();
        state.byGoods = new Map(state.data.books.map(b => [b.goods_no, b]));
      } catch (error) {
        console.error('Error loading sales data:', error);
        document.getElementById('loading').textContent = '판매 데이터를 불러오지 못했습니다. 수집이 한 번 이상 실행된 뒤에 표시됩니다.';
        return;
      }
      try {
        const info = await (await fetch('deploy_info.json')).json();
        document.getElementById('deploy-date').textContent = info.last_deploy;
      } catch (error) {
        document.getElementById('deploy-date').textContent = '정보 없음';
      }
      document.getElementById('latest-date').textContent = state.data.latest_date || '없음';

      document.getElementById('loading').hidden = true;
      document.getElementById('app').hidden = false;
      bindControls();
      bindFreshModal();
      renderSummary();
      renderMomentum();
      renderTrend();
    }

    loadAll();
  </script>
</body>
</html>
