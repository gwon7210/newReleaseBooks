name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 (KST). GitHub 예약 실행은 보통 수십 분~몇 시간 늦게 시작된다

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Run scraper
        run: python newbooks.py

      - name: Commit sales data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update sales data $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build site
        run: |
          mkdir -p public
          cp index.html sales.html books_data.json sales_data.json public/
          echo "{\"last_deploy\": \"$(TZ='Asia/Seoul' date '+%Y년 %m월 %d일 %H:%M')\"}" > public/deploy_info.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
